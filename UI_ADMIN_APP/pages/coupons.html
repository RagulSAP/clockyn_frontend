<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clockyn — Coupons</title>
  <meta name="color-scheme" content="light dark" />
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <aside class="sidebar" id="app-sidebar" data-active="coupons"></aside>
  <script src="../js/layout.js"></script>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger-btn" onclick="toggleSidebar()" title="Menu">☰</button>
      <span class="topbar-title">Coupons</span>
      <div class="topbar-search">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="Search coupons..." oninput="filterCoupons()" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="loadCoupons()" title="Refresh">🔄</button>
        <div class="topbar-user-pill">
          <div class="avatar" id="topbar-avatar" style="cursor:pointer;">SA</div>
          <div class="topbar-user-info">
            <div class="topbar-user-name" id="topbar-user-name">Super Admin</div>
            <div class="topbar-user-role" id="topbar-user-role">Super Admin</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1>Coupons</h1>
          <p>Manage discount coupons for subscription plans.</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Coupon</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Coupon ID</th>
                <th>Coupon Name</th>
                <th>Discount (%)</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="coupons-table-body">
              <tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Coupon Modal -->
  <div id="add-modal" class="modal-overlay" style="display:none;" onclick="closeOnOverlay(event,'add-modal')">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Add Coupon</span>
        <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Coupon Name</label>
          <input type="text" id="add-name" placeholder="e.g. SAVE20" />
        </div>
        <div class="form-group">
          <label>Discount (%)</label>
          <input type="number" id="add-discount" placeholder="e.g. 20" min="0" max="100" step="0.01" />
        </div>
        <div id="add-error" class="form-error" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('add-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="submitAdd()">Add Coupon</button>
      </div>
    </div>
  </div>

  <!-- Edit Coupon Modal -->
  <div id="edit-modal" class="modal-overlay" style="display:none;" onclick="closeOnOverlay(event,'edit-modal')">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Edit Coupon</span>
        <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label>Coupon Name</label>
          <input type="text" id="edit-name" placeholder="e.g. SAVE20" />
        </div>
        <div class="form-group">
          <label>Discount (%)</label>
          <input type="number" id="edit-discount" placeholder="e.g. 20" min="0" max="100" step="0.01" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="edit-status">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>
        <div id="edit-error" class="form-error" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('edit-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <style>
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-box {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-md); width: 420px; max-width: 95vw;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .modal-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    }
    .modal-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input, .form-group select {
      background: var(--bg-tertiary); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 12px;
      color: var(--text-primary); font-size: 13px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue); }
    .form-group select option { background: var(--bg-tertiary); }
    .form-error { font-size: 12px; color: var(--red); padding: 6px 10px; background: rgba(239,68,68,0.1); border-radius: 6px; }
  </style>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let allCoupons = [];

    function statusBadge(status) {
      return status === 1
        ? '<span class="badge badge-green">Active</span>'
        : '<span class="badge badge-gray">Inactive</span>';
    }

    function renderTable(data) {
      const tbody = document.getElementById('coupons-table-body');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">No coupons found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(c =>
        `<tr>
          <td class="td-primary">#${c.coupon_id}</td>
          <td class="td-primary">${c.coupon_name}</td>
          <td>${parseFloat(c.discount).toFixed(2)}%</td>
          <td>${statusBadge(c.status)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="openEditModal(${c.coupon_id},'${c.coupon_name}',${c.discount},${c.status})">✏️ Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCoupon(${c.coupon_id},'${c.coupon_name}')">🗑️ Delete</button>
          </td>
        </tr>`
      ).join('');
    }

    async function loadCoupons() {
      try {
        const res = await fetch(API_BASE + '/plans/coupons').then(r => r.json());
        allCoupons = res.data || [];
        renderTable(allCoupons);
      } catch(e) {
        document.getElementById('coupons-table-body').innerHTML =
          '<tr><td colspan="5" style="text-align:center;color:var(--red)">Failed to load coupons</td></tr>';
      }
    }

    function filterCoupons() {
      const q = document.getElementById('search-input').value.toLowerCase();
      renderTable(allCoupons.filter(c => c.coupon_name.toLowerCase().includes(q)));
    }

    /* ── Add Modal ── */
    function openAddModal() {
      document.getElementById('add-name').value = '';
      document.getElementById('add-discount').value = '';
      document.getElementById('add-error').style.display = 'none';
      document.getElementById('add-modal').style.display = 'flex';
    }

    async function submitAdd() {
      const name = document.getElementById('add-name').value.trim();
      const discount = parseFloat(document.getElementById('add-discount').value);
      const errEl = document.getElementById('add-error');
      if (!name || isNaN(discount) || discount < 0 || discount > 100) {
        errEl.textContent = 'Please enter a valid coupon name and discount (0–100).';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      try {
        const res = await fetch(API_BASE + '/plans/coupons', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coupon_name: name, discount })
        }).then(r => r.json());
        if (res.success) {
          closeModal('add-modal');
          loadCoupons();
        } else {
          errEl.textContent = res.detail || 'Failed to add coupon.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
      }
    }

    /* ── Edit Modal ── */
    function openEditModal(id, name, discount, status) {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-name').value = name;
      document.getElementById('edit-discount').value = discount;
      document.getElementById('edit-status').value = status;
      document.getElementById('edit-error').style.display = 'none';
      document.getElementById('edit-modal').style.display = 'flex';
    }

    async function submitEdit() {
      const id = parseInt(document.getElementById('edit-id').value);
      const name = document.getElementById('edit-name').value.trim();
      const discount = parseFloat(document.getElementById('edit-discount').value);
      const status = parseInt(document.getElementById('edit-status').value);
      const errEl = document.getElementById('edit-error');
      if (!name || isNaN(discount) || discount < 0 || discount > 100) {
        errEl.textContent = 'Please enter a valid coupon name and discount (0–100).';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      try {
        const res = await fetch(API_BASE + '/plans/coupons/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coupon_name: name, discount, status })
        }).then(r => r.json());
        if (res.success) {
          closeModal('edit-modal');
          loadCoupons();
        } else {
          errEl.textContent = res.detail || 'Failed to update coupon.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeOnOverlay(e, id) { if (e.target.id === id) closeModal(id); }
    function handleLogout() { if (confirm('Are you sure you want to logout?')) logout(); }

    async function deleteCoupon(id, name) {
      if (!confirm(`Delete coupon "${name}"? This cannot be undone.`)) return;
      try {
        const res = await fetch(API_BASE + '/plans/coupons/' + id, { method: 'DELETE' }).then(r => r.json());
        if (res.success) loadCoupons();
        else alert(res.detail || 'Failed to delete coupon.');
      } catch(e) {
        alert('Network error. Please try again.');
      }
    }

    loadCoupons();

    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('open');
    }
    function closeSidebar() {
      document.querySelector('.sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }
  </script>

</body>
</html>
