<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clockyn screen video</title>
<script src="config.js"></script>
<script>
  // fonts + logo come from the app checkout (CONFIG.repoUrl is a file:// URL written by timing.py)
  const F = CONFIG.repoUrl + '/node_modules/@expo-google-fonts/outfit/';
  document.write('<style>' +
    `@font-face{font-family:'Outfit';font-weight:400;src:url('${F}400Regular/Outfit_400Regular.ttf')}` +
    `@font-face{font-family:'Outfit';font-weight:600;src:url('${F}600SemiBold/Outfit_600SemiBold.ttf')}` +
    `@font-face{font-family:'Outfit';font-weight:700;src:url('${F}700Bold/Outfit_700Bold.ttf')}` +
    '</style>');
</script>
<style>
  :root { --bg:#F2F1EE; --surface:#FFFFFF; --muted-surface:#ECEAE5; --text:#0D0D0D; --border:#E1DFD9; --ok:#0A7A4B; --ok-soft:#DCF3E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: 'Outfit', system-ui, sans-serif; color: var(--text); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(1200px 900px at 50% 38%, #FFFFFF 0%, var(--bg) 70%); }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { position: absolute; left: 80px; right: 80px; top: 96px; height: 96px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 88px; height: 88px; border-radius: 24px; }
  .brand b { font-size: 56px; font-weight: 700; letter-spacing: -1px; }
  #pill { background: var(--text); color: #fff; font-weight: 600; font-size: 38px; padding: 14px 34px; border-radius: 999px; min-width: 150px; text-align: center; }

  #s1 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #s1 .ico { position: absolute; left: 410px; top: 400px; width: 260px; height: 260px; border-radius: 80px; background: var(--text); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 140px; box-shadow: 0 30px 60px rgba(0,0,0,.18); }
  #q { position: absolute; left: 90px; right: 90px; top: 760px; text-align: center; font-size: 112px; line-height: 1.12; font-weight: 700; letter-spacing: -2px; }
  #q span { display: inline-block; margin: 0 14px; opacity: 0; }
  #chip { position: absolute; left: 50%; top: 1230px; transform: translateX(-50%); background: var(--ok-soft); color: var(--ok); font-size: 50px; font-weight: 600; padding: 22px 48px; border-radius: 999px; display: flex; gap: 20px; align-items: center; white-space: nowrap; }

  /* the phone shows the REAL app: frames of the recorded screencast */
  #phone { position: absolute; left: 260px; top: 266px; width: 560px; height: 1186px; border-radius: 78px; background: var(--text); padding: 14px; box-shadow: 0 50px 100px rgba(0,0,0,.25); transform-origin: 50% 50%; }
  #screenWrap { position: relative; width: 100%; height: 100%; border-radius: 64px; overflow: hidden; background: var(--bg); }
  #live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  #finger { position: absolute; width: 84px; height: 84px; border-radius: 42px; background: rgba(13,13,13,.55); border: 6px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); opacity: 0; }
  .ripple { position: absolute; width: 84px; height: 84px; border-radius: 42px; border: 6px solid var(--ok); opacity: 0; }

  #caption { position: absolute; left: 70px; right: 70px; top: 1530px; min-height: 230px; background: var(--surface); border: 2px solid var(--border); border-radius: 44px; padding: 36px 30px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 46px; line-height: 1.22; font-weight: 600; box-shadow: 0 20px 50px rgba(0,0,0,.08); }
  #caption em { font-style: normal; color: var(--ok); }
  #progress { position: absolute; left: 80px; right: 80px; top: 1830px; height: 12px; border-radius: 6px; background: var(--muted-surface); overflow: hidden; }
  #wm { position: absolute; left: 0; right: 0; top: 1866px; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: 4px; color: var(--text); opacity: .5; }
  #bar { display: block; height: 100%; width: 0; background: var(--text); border-radius: 6px; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><img id="logo" alt=""><b>Clockyn</b></div>
    <div id="pill"></div>
  </header>

  <section id="s1">
    <div class="ico" id="s1ico"><svg class="i" id="s1svg" viewBox="0 0 24 24"></svg></div>
    <div id="q"></div>
    <div id="chip"><svg class="i" viewBox="0 0 24 24" style="font-size:54px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="chipText"></span></div>
  </section>

  <div id="phone"><div id="screenWrap"><img id="live" alt=""></div></div>

  <div id="ripple" class="ripple"></div>
  <div id="finger"></div>
  <div id="caption"><span id="capText"></span></div>
  <div id="progress"><i id="bar"></i></div>
  <div id="wm"></div>
</div>

<script src="timing.js"></script>
<script src="src.js"></script>
<script>
const CFG = window.CONFIG, T = window.TIMING, S = T.scenes, SRC = window.SRC;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fin = 0.25, fout = 0.25) => Math.min(seg(t, a, a + fin), 1 - seg(t, b - fout, b));

// icons for the opening card (lucide-style 24x24 paths); pick one with "introIcon" in config.json
const ICONS = {
  'user-plus': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  'calendar': '<rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>',
  'wallet': '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  'map-pin': '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  'receipt': '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  'check': '<path d="M20 6 9 17l-5-5"/>',
  'play': '<polygon points="6 3 20 12 6 21 6 3"/>',
  'message': '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
};
$('s1svg').innerHTML = ICONS[CFG.introIcon] || ICONS.play;
$('logo').src = CFG.repoUrl + '/assets/clockyn-logo.png';
$('chipText').textContent = CFG.badge || '';
$('wm').textContent = CFG.watermark || '';   // small text under the progress bar on every frame
$('chip').style.display = CFG.badge ? 'flex' : 'none';

const CAPTIONS = CFG.scenes.map((s) => s.caption);
const PILLS = CFG.scenes.map((s) => s.pill || '');

const words = CFG.question.split(' ');
$('q').innerHTML = words.map((w) => `<span>${w}</span>`).join(' ');
const wordEls = [...$('q').children];

// ---- video time <-> recording time (piecewise linear through the anchors; holds the first/last frame outside)
const A = SRC.anchors;
function toSrc(t) {
  if (t <= A[0][0]) return A[0][1];
  for (let i = 0; i < A.length - 1; i++) {
    const [o1, s1] = A[i], [o2, s2] = A[i + 1];
    if (t <= o2) return s1 + (s2 - s1) * ((t - o1) / (o2 - o1));
  }
  return A[A.length - 1][1];
}
function toOut(s) {
  if (s <= A[0][1]) return A[0][0];
  for (let i = 0; i < A.length - 1; i++) {
    const [o1, s1] = A[i], [o2, s2] = A[i + 1];
    if (s <= s2) return o1 + (o2 - o1) * ((s - s1) / (s2 - s1));
  }
  return A[A.length - 1][0];
}
const F2 = SRC.frames;
function frameAt(s) {
  let lo = 0, hi = F2.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (F2[mid].t <= s) lo = mid; else hi = mid - 1; }
  return F2[lo];
}
// the taps on the video clock, grouped into clusters (taps less than 1.2 s apart share one travelling finger)
const taps = SRC.taps.map((p) => ({ T: toOut(p.t), x: p.x, y: p.y })).sort((a, b) => a.T - b.T);
const clusters = [];
taps.forEach((p) => {
  const c = clusters[clusters.length - 1];
  if (c && p.T - c[c.length - 1].T <= 1.2) c.push(p); else clusters.push([p]);
});
const APPROACH = 0.6, LINGER = 0.55;

let shown = '';
function screenPoint(p) {
  const r = $('screenWrap').getBoundingClientRect();
  return [r.left + (p.x / SRC.vw) * r.width, r.top + (p.y / SRC.vh) * r.height];
}

function drawFinger(t) {
  const f = $('finger'), rp = $('ripple');
  let op = 0, x = 0, y = 0, press = 0, ripple = 0, rx = 0, ry = 0;
  for (const c of clusters) {
    const first = c[0], last = c[c.length - 1];
    if (t < first.T - APPROACH || t > last.T + LINGER) continue;
    const pts = c.map(screenPoint);
    const start = [pts[0][0] + 90, pts[0][1] + 190];
    if (t < first.T) {
      const k = eio(seg(t, first.T - APPROACH, first.T));
      x = start[0] + (pts[0][0] - start[0]) * k; y = start[1] + (pts[0][1] - start[1]) * k;
    } else {
      let i = 0;
      while (i < c.length - 1 && t >= c[i + 1].T) i++;
      if (i === c.length - 1) { x = pts[i][0]; y = pts[i][1]; }
      else {
        const k = eio(seg(t, c[i].T + 0.05, c[i + 1].T - 0.02));
        x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k; y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k;
      }
    }
    op = Math.min(seg(t, first.T - APPROACH, first.T - APPROACH + 0.2), 1 - seg(t, last.T + 0.25, last.T + LINGER));
    c.forEach((p, j) => {
      press = Math.max(press, seg(t, p.T - 0.07, p.T) * (1 - seg(t, p.T, p.T + 0.16)));
      const r = seg(t, p.T, p.T + 0.45);
      if (r > 0 && r < 1) { ripple = 0.85 * (1 - r); rx = pts[j][0]; ry = pts[j][1]; rp.dataset.k = r; }
    });
    break;
  }
  f.style.opacity = op;
  f.style.transform = `translate(${x - 42}px, ${y - 42}px) scale(${1 - 0.2 * press})`;
  const r = ripple ? Number(rp.dataset.k) : 0;
  rp.style.opacity = ripple;
  rp.style.transform = `translate(${rx - 42}px, ${ry - 42}px) scale(${1 + 2.2 * eo(r)})`;
}

function render(t) {
  const s1 = S[0], s2 = S[1], last = S.length - 1;
  let idx = 0;
  S.forEach((s, i) => { if (t >= s.start - 0.05) idx = i; });
  $('pill').textContent = PILLS[idx];
  $('pill').style.visibility = PILLS[idx] ? 'visible' : 'hidden';
  const sc = S[idx];
  $('capText').innerHTML = CAPTIONS[idx];
  $('caption').style.opacity = win(t, sc.start - 0.05, idx === last ? T.total : sc.end + 0.12, 0.2, idx === last ? 0.4 : 0.15);
  $('caption').style.transform = `translateY(${(1 - eo(seg(t, sc.start - 0.05, sc.start + 0.25))) * 24}px)`;
  $('bar').style.width = (clamp(t / T.total) * 100).toFixed(2) + '%';

  // scene 1: the opening question card
  const s1op = 1 - seg(t, s2.start - 0.35, s2.start);
  $('s1').style.opacity = s1op;
  $('s1').style.display = s1op <= 0 ? 'none' : 'block';
  $('s1ico').style.transform = `scale(${eb(seg(t, 0.05, 0.65))}) rotate(${(1 - eo(seg(t, 0.05, 0.65))) * -12}deg)`;
  wordEls.forEach((el, i) => {
    const a = 0.45 + i * 0.16, k = eo(seg(t, a, a + 0.28));
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * 36}px)`;
  });
  const at = Math.min(s1.start + 2.3, Math.max(0.5, s1.end - 0.8));
  const chipK = eb(seg(t, at, at + 0.5));
  $('chip').style.opacity = seg(t, at, at + 0.3);
  $('chip').style.transform = `translateX(-50%) scale(${0.7 + 0.3 * chipK})`;

  // the phone with the real app (scenes 2..N)
  const phoneIn = eb(seg(t, s2.start - 0.4, s2.start + 0.2));
  $('phone').style.opacity = seg(t, s2.start - 0.4, s2.start - 0.1);
  $('phone').style.transform = `translateY(${(1 - phoneIn) * 260}px) scale(${1 + 0.03 * seg(t, s2.start, T.total)})`;
  const fr = frameAt(toSrc(t));
  if (fr.f !== shown) { shown = fr.f; $('live').src = 'live/' + fr.f; }
  drawFinger(t);
}
window.render = render;
// Long questions: shrink the title until it fits above the badge (measured once the font has loaded).
const fitted = document.fonts.ready.then(() => {
  for (const px of [112, 100, 90, 80, 72, 64]) {
    $('q').style.fontSize = px + 'px';
    if ($('q').offsetHeight <= 440) break;
  }
});
window.ready = () => fitted.then(() => $('live').complete && $('live').naturalWidth ? Promise.resolve() : new Promise((res) => { $('live').onload = res; $('live').onerror = res; })).then(() => $('live').decode().catch(() => undefined));
render(0);
</script>
</body>
</html>
